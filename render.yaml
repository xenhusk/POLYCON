services:
  # Backend API Service
  - type: web
    name: polycon-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -k eventlet --workers 1 --worker-connections 1000 --timeout 120 --keep-alive 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: polycon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://polycon-frontend.onrender.com
      - key: FLASK_ENV
        value: production
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet

  # Frontend Service  
  - type: web
    name: polycon-frontend
    env: static
    buildCommand: cd frontend/my-app && npm install && npm run build
    staticPublishPath: frontend/my-app/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://polycon.onrender.com
      - key: SMTP_SERVER
      - key: SMTP_PORT
      - key: SMTP_USER
      - key: SMTP_PASSWORD
      - key: FROM_EMAIL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: polycon-db
    databaseName: polycondb
    user: polycon_user
